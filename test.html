<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexaJS v0.6.0 - Test Suite</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
        .test-result { padding: 0.5rem; margin: 0.5rem 0; border-radius: 4px; }
        .pass { background: #d4edda; color: #155724; }
        .fail { background: #f8d7da; color: #721c24; }
        h1 { color: #333; }
        .summary { font-weight: bold; font-size: 1.2rem; margin-top: 2rem; }
        .test-section { margin: 2rem 0; }
        .test-section h2 { color: #555; border-bottom: 2px solid #ddd; padding-bottom: 0.5rem; }
        #results { margin-top: 1rem; }
    </style>
</head>
<body>
    <h1>🧪 NexaJS v0.6.0 Test Suite</h1>
    <p>Comprehensive test suite for error handling, reactivity, directives, and new features</p>
    <div id="results"></div>
    <div class="summary" id="summary"></div>

    <script src="nexajs.js"></script>
    <script>
        const results = [];
        let passed = 0, failed = 0;

        function test(name, fn) {
            try {
                const result = fn();
                if (result instanceof Promise) {
                    result.then(() => {
                        results.push({ name, pass: true });
                        passed++;
                        updateUI();
                    }).catch(err => {
                        results.push({ name, pass: false, error: err.message });
                        failed++;
                        updateUI();
                    });
                } else {
                    results.push({ name, pass: true });
                    passed++;
                }
            } catch (e) {
                results.push({ name, pass: false, error: e.message });
                failed++;
            }
        }

        function assert(condition, message) {
            if (!condition) throw new Error(message || 'Assertion failed');
        }

        function updateUI() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '';
            results.forEach(r => {
                const div = document.createElement('div');
                div.className = `test-result ${r.pass ? 'pass' : 'fail'}`;
                div.textContent = `${r.pass ? '✅' : '❌'} ${r.name}` + (r.error ? `: ${r.error}` : '');
                resultsDiv.appendChild(div);
            });
            document.getElementById('summary').textContent = 
                `Results: ${passed} passed, ${failed} failed`;
        }

        // ==================== REACTIVITY TESTS ====================
        
        test('Reactive: Basic property access and mutation', () => {
            const state = Nexa.reactive({ count: 0 });
            assert(state.count === 0, 'Initial value should be 0');
            state.count = 5;
            assert(state.count === 5, 'Updated value should be 5');
        });

        test('Reactive: Nested objects', () => {
            const state = Nexa.reactive({ user: { name: 'John' } });
            assert(state.user.name === 'John', 'Nested value accessible');
            state.user.name = 'Jane';
            assert(state.user.name === 'Jane', 'Nested value updatable');
        });

        test('Reactive: Deep nesting', () => {
            const state = Nexa.reactive({ a: { b: { c: { d: 1 } } } });
            assert(state.a.b.c.d === 1, 'Deep nested value accessible');
            state.a.b.c.d = 2;
            assert(state.a.b.c.d === 2, 'Deep nested value updatable');
        });

        test('Reactive: Error handling on invalid input', () => {
            let errorCaught = false;
            window.addEventListener('nexajs:error', () => { errorCaught = true; }, { once: true });
            // This should not crash the framework
            const result = Nexa.reactive(null);
            assert(result === null, 'Should handle null gracefully');
        });

        // ==================== COMPUTED TESTS ====================

        test('Computed: Basic computation', () => {
            return new Promise(resolve => {
                const state = Nexa.reactive({ count: 2 });
                const double = Nexa.computed(() => state.count * 2);
                assert(double.value === 4, 'Computed value should be 4');
                state.count = 5;
                Nexa.nextTick().then(() => {
                    assert(double.value === 10, 'Computed should update to 10');
                    resolve();
                });
            });
        });

        test('Computed: Multiple dependencies', () => {
            const state = Nexa.reactive({ a: 2, b: 3 });
            const sum = Nexa.computed(() => state.a + state.b);
            assert(sum.value === 5, 'Sum should be 5');
            state.a = 10;
            assert(sum.value === 13, 'Sum should update to 13');
        });

        test('Computed: Error handling with invalid getter', () => {
            let errorCaught = false;
            window.addEventListener('nexajs:error', () => { errorCaught = true; }, { once: true });
            const result = Nexa.computed('not a function');
            assert(result.value === undefined, 'Invalid computed should return undefined');
        });

        // ==================== WATCH TESTS ====================

        test('Watch: Callback triggered on change', () => {
            return new Promise(resolve => {
                const state = Nexa.reactive({ val: 1 });
                let called = false;
                Nexa.watch(() => state.val, (newVal, oldVal) => {
                    called = true;
                    assert(newVal === 2, 'New value should be 2');
                    assert(oldVal === 1, 'Old value should be 1');
                    resolve();
                });
                state.val = 2;
            });
        });

        test('Watch: Immediate option', () => {
            return new Promise(resolve => {
                const state = Nexa.reactive({ val: 1 });
                let immediateCalled = false;
                Nexa.watch(() => state.val, (newVal) => {
                    if (!immediateCalled) {
                        immediateCalled = true;
                        assert(newVal === 1, 'Immediate callback should receive initial value');
                        resolve();
                    }
                }, { immediate: true });
            });
        });

        test('Watch: Error handling with invalid arguments', () => {
            let errorCaught = false;
            window.addEventListener('nexajs:error', () => { errorCaught = true; }, { once: true });
            const result = Nexa.watch('not a function', 'not a callback');
            assert(typeof result.stop === 'function', 'Should return object with stop method');
        });

        // ==================== EFFECT TESTS ====================

        test('Effect: Basic effect execution', () => {
            return new Promise(resolve => {
                const state = Nexa.reactive({ count: 0 });
                let effectValue = 0;
                Nexa.effect(() => {
                    effectValue = state.count;
                });
                assert(effectValue === 0, 'Effect should execute initially');
                state.count = 5;
                Nexa.nextTick().then(() => {
                    assert(effectValue === 5, 'Effect should track changes');
                    resolve();
                });
            });
        });

        test('Effect: Error handling with invalid function', () => {
            let errorCaught = false;
            window.addEventListener('nexajs:error', () => { errorCaught = true; }, { once: true });
            const result = Nexa.effect('not a function');
            assert(result.disabled === true, 'Invalid effect should be disabled');
        });

        test('Effect: Stop method works', () => {
            const state = Nexa.reactive({ count: 0 });
            let effectCount = 0;
            const runner = Nexa.effect(() => {
                effectCount++;
                state.count; // Track dependency
            });
            assert(effectCount === 1, 'Effect should run once initially');
            runner.stop();
            state.count = 5;
            Nexa.nextTick().then(() => {
                assert(effectCount === 1, 'Effect should not run after stop');
            });
        });

        // ==================== STORE TESTS (NEW v0.6.0) ====================

        test('Store: Creates global store', () => {
            const store = Nexa.store({ count: 0, user: 'test' });
            assert(store.count === 0, 'Store initial value correct');
            assert(store.user === 'test', 'Store user value correct');
        });

        test('Store: Returns same instance', () => {
            const store1 = Nexa.store({ x: 1 });
            const store2 = Nexa.store({ y: 2 });
            assert(store1 === store2, 'Store should be singleton');
        });

        test('Store: Reactive updates', () => {
            return new Promise(resolve => {
                const store = Nexa.store({ val: 5 });
                Nexa.watch(() => store.val, (newVal) => {
                    if (newVal === 10) {
                        assert(true, 'Store update detected');
                        resolve();
                    }
                });
                store.val = 10;
            });
        });

        // ==================== NEXTTICK TESTS ====================

        test('NextTick: Executes after DOM update', () => {
            return new Promise(resolve => {
                let executed = false;
                Nexa.nextTick(() => {
                    executed = true;
                    assert(executed, 'nextTick callback executed');
                    resolve();
                });
            });
        });

        test('NextTick: Returns promise', () => {
            const result = Nexa.nextTick();
            assert(result instanceof Promise, 'nextTick should return a promise');
        });

        // ==================== DIRECTIVE TESTS ====================

        test('Directives: Custom directive registration', () => {
            let directiveCalled = false;
            Nexa.registerDirective('test', (el, expr, ctx) => {
                directiveCalled = true;
            });
            assert(typeof Nexa.registerDirective === 'function', 'registerDirective API exists');
        });

        test('Directives: x-ref creates $refs object', () => {
            // Create a test element
            const div = document.createElement('div');
            div.setAttribute('x-ref', 'myElement');
            document.body.appendChild(div);
            
            const ctx = {};
            
            // Simulate directive execution
            const refName = 'myElement';
            ctx.$refs = ctx.$refs || {};
            ctx.$refs[refName] = div;
            
            assert(ctx.$refs.myElement === div, '$refs should contain element');
            
            document.body.removeChild(div);
        });

        // ==================== ERROR HANDLING TESTS ====================

        test('Error Handling: Global error event dispatched', () => {
            return new Promise(resolve => {
                window.addEventListener('nexajs:error', (e) => {
                    assert(e.detail !== undefined, 'Error event should have detail');
                    resolve();
                }, { once: true });
                
                // Trigger an error
                Nexa.computed(() => { throw new Error('Test error'); });
            });
        });

        // Render results after all sync tests
        setTimeout(() => {
            updateUI();
        }, 100);
    </script>
</body>
</html>
